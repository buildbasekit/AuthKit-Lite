auth.jwt.secret=super-secure-test-secret-that-is-at-least-256-bits-long-for-hmac-sha256
auth.jwt.issuer=authkit
auth.jwt.audience=authkit-api
auth.jwt.access-token-ttl=15m
auth.jwt.refresh-token-ttl=14d
spring.datasource.url=jdbc:h2:mem:authkit_lite_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
authkit.passkey.enabled=true
authkit.passkey.rp-name=AuthKit-Lite Test
authkit.passkey.rp-id=localhost
authkit.passkey.allowed-origins=http://localhost:8080,http://localhost:3000
authkit.demo-data.enabled=false
