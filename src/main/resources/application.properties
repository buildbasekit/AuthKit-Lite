# Application Name
spring.application.name=AuthKit-Lite

# Optional Local Overrides
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:h2:mem:authkit_lite;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true

# Dummy Data (disable outside local/demo environments)
authkit.demo-data.enabled=${AUTHKIT_DEMO_DATA_ENABLED:true}

# JWT Configuration
auth.jwt.secret=${JWT_SECRET:${random.uuid}${random.uuid}}
auth.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
auth.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:14d}
auth.jwt.issuer=${JWT_ISSUER:authkit}
auth.jwt.audience=${JWT_AUDIENCE:authkit-api}

# Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,info

# Graceful Deployment Lifecycle
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}

# Passkey Configuration
authkit.passkey.enabled=${PASSKEY_ENABLED:false}
authkit.passkey.rp-name=${PASSKEY_RP_NAME:BuildBaseKit AuthKit-Lite}
authkit.passkey.rp-id=${PASSKEY_RP_ID:localhost}
authkit.passkey.allowed-origins=${PASSKEY_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
